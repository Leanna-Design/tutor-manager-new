<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f6f6f3"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Tutor Manager"
    >

    <!-- Your app icon -->
    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-home-192.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="192x192"
        href="./icon-home-192.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="512x512"
        href="./icon-home-512.png"
    >

    <title>Tutor Manager</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            margin: 0;
            padding: 0;
            background: #f6f6f3;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 5%,
                    #ffffff 0%,
                    #f6f6f3 48%,
                    #eeeeeb 100%
                );

            color: #171717;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        input {
            outline: none;
        }


        /* ===============================
           PAGE
        =============================== */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                calc(28px + env(safe-area-inset-top))
                20px
                calc(28px + env(safe-area-inset-bottom));
        }


        /* ===============================
           LOGIN CARD
        =============================== */

        .login-card {
            width: 100%;
            max-width: 430px;

            padding: 30px 24px 25px;

            border-radius: 30px;

            background:
                rgba(255,255,255,.88);

            border:
                1px solid rgba(0,0,0,.07);

            box-shadow:
                0 25px 70px rgba(0,0,0,.09);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);
        }


        /* ===============================
           BRAND
        =============================== */

        .brand {
            text-align: center;
        }

        .app-icon {
            width: 76px;
            height: 76px;

            margin: 0 auto 17px;

            border-radius: 22px;

            overflow: hidden;

            background: #ffffff;

            border:
                1px solid rgba(0,0,0,.07);

            box-shadow:
                0 12px 28px rgba(0,0,0,.12);
        }

        .app-icon img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        .brand h1 {
            margin: 0;

            font-size: 27px;

            line-height: 1.1;

            font-weight: 780;

            letter-spacing: -.8px;
        }

        .brand p {
            margin: 7px 0 0;

            color: #858782;

            font-size: 13px;
        }


        /* ===============================
           ROLE SELECTOR
        =============================== */

        .role-section {
            margin-top: 28px;
        }

        .role-label {
            margin-bottom: 9px;

            color: #666965;

            font-size: 12px;

            font-weight: 700;
        }

        .roles {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 9px;
        }

        .role {
            min-height: 76px;

            padding: 11px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 5px;

            border-radius: 18px;

            background: #f1f1ee;

            color: #777a76;

            border:
                1px solid transparent;

            transition:
                background .18s ease,
                color .18s ease,
                border .18s ease,
                transform .15s ease;
        }

        .role-icon {
            font-size: 21px;

            line-height: 1;
        }

        .role-title {
            font-size: 12px;

            font-weight: 700;
        }

        .role.active {
            background: #171717;

            color: #ffffff;

            border-color: #171717;
        }

        .role:active {
            transform: scale(.97);
        }


        /* ===============================
           FORM
        =============================== */

        .form {
            margin-top: 23px;
        }

        .field {
            margin-top: 15px;
        }

        .field:first-child {
            margin-top: 0;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #5e615e;

            font-size: 12px;

            font-weight: 700;
        }

        .field input {
            width: 100%;

            min-height: 52px;

            padding: 13px 15px;

            border-radius: 16px;

            border:
                1px solid #dedfdb;

            background: #fafaf8;

            color: #171717;

            font-size: 15px;

            transition:
                border .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .field input::placeholder {
            color: #a0a29e;
        }

        .field input:focus {
            background: #ffffff;

            border-color: #8c908c;

            box-shadow:
                0 0 0 4px rgba(0,0,0,.045);
        }


        /* ===============================
           LOGIN BUTTON
        =============================== */

        .login-button {
            width: 100%;

            min-height: 54px;

            margin-top: 21px;

            border-radius: 17px;

            background: #171717;

            color: #ffffff;

            font-size: 15px;

            font-weight: 720;

            box-shadow:
                0 9px 22px rgba(0,0,0,.15);

            transition:
                transform .15s ease,
                opacity .15s ease;
        }

        .login-button:active {
            transform: scale(.98);
        }


        /* ===============================
           DEMO NOTICE
        =============================== */

        .demo-notice {
            margin-top: 16px;

            padding: 11px 13px;

            border-radius: 14px;

            background: #f2f2ef;

            color: #777a76;

            text-align: center;

            font-size: 11px;

            line-height: 1.45;
        }


        /* ===============================
           FOOTER
        =============================== */

        .footer {
            margin-top: 21px;

            text-align: center;

            color: #a0a29e;

            font-size: 10px;
        }


        /* ===============================
           SMALL PHONE
        =============================== */

        @media (max-width: 360px) {

            .page {
                padding-left: 14px;
                padding-right: 14px;
            }

            .login-card {
                padding:
                    25px 19px 21px;
            }

            .app-icon {
                width: 68px;
                height: 68px;

                border-radius: 20px;
            }

            .brand h1 {
                font-size: 25px;
            }

        }


        /* ===============================
           REDUCE MOTION
        =============================== */

        @media (prefers-reduced-motion: reduce) {

            * {
                transition: none !important;
            }

        }

    </style>
</head>


<body>

    <div class="page">

        <main class="login-card">


            <!-- =========================
                 BRAND
            ========================== -->

            <section class="brand">

                <div class="app-icon">

                    <img
                        src="./icon-home-192.png"
                        alt="Tutor Manager"
                    >

                </div>

                <h1>
                    Tutor Manager
                </h1>

                <p>
                    Your teaching workspace
                </p>

            </section>


            <!-- =========================
                 ROLE
            ========================== -->

            <section class="role-section">

                <div class="role-label">
                    SIGN IN AS
                </div>


                <div class="roles">

                    <button
                        class="role active"
                        type="button"
                        data-role="Tutor"
                        onclick="selectRole(this)"
                    >

                        <span class="role-icon">
                            👩🏻‍🏫
                        </span>

                        <span class="role-title">
                            Tutor
                        </span>

                    </button>


                    <button
                        class="role"
                        type="button"
                        data-role="Parent"
                        onclick="selectRole(this)"
                    >

                        <span class="role-icon">
                            👨‍👩‍👧
                        </span>

                        <span class="role-title">
                            Parent
                        </span>

                    </button>

                </div>

            </section>


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form
                class="form"
                onsubmit="handleLogin(event)"
            >

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    class="login-button"
                    type="submit"
                >
                    Sign In
                </button>

            </form>


            <!-- =========================
                 DEMO MESSAGE
            ========================== -->

            <div class="demo-notice">

                Demo login for now.<br>
                Real account authentication will be connected later.

            </div>


            <div class="footer">
                Tutor Manager · Private & Secure
            </div>


        </main>

    </div>


    <script>

        let selectedRole = "Tutor";


        function selectRole(button) {

            document
                .querySelectorAll(".role")
                .forEach(function(role) {

                    role.classList.remove("active");

                });


            button.classList.add("active");

            selectedRole =
                button.dataset.role;

        }


        function handleLogin(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            if (!email) {
                return;
            }


            alert(
                "Demo login\n\n" +
                "Role: " +
                selectedRole +
                "\n\n" +
                "Real authentication will be connected in the next step."
            );

        }

    </script>

</body>
</html>
