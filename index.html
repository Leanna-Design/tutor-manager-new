
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #5b5bd6;
      --primary-dark: #4646b8;
      --border: #e5e7eb;
      --danger: #dc2626;
      --success: #16a34a;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(91,91,214,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(91,91,214,.10), transparent 35%),
        var(--bg);
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      font-size: 34px;
      font-weight: 700;
      box-shadow: 0 14px 30px rgba(91,91,214,.25);
    }

    .brand h1 {
      font-size: 27px;
      margin-bottom: 5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
    }

    .auth-card h2 {
      font-size: 21px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .field input,
    .phone-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      background: #fff;
      transition: .2s;
    }

    .field input:focus,
    .phone-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91,91,214,.10);
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .country-code {
      width: 82px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      font-size: 14px;
      font-weight: 600;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      transition: .2s;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      background: white;
      color: var(--text);
      font-weight: 600;
    }

    .switch-mode {
      margin-top: 17px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .switch-mode button {
      border: 0;
      background: none;
      color: var(--primary);
      font-weight: 700;
    }

    .message {
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: var(--danger);
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: var(--success);
    }

    /* =========================
       APP
    ========================= */

    #appScreen {
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 700;
    }

    .small-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      font-weight: 700;
    }

    .logout-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 600;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      width: 230px;
      background: white;
      border-right: 1px solid var(--border);
      padding: 18px 12px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 11px;
      padding: 12px;
      text-align: left;
      margin-bottom: 5px;
      color: #4b5563;
      font-weight: 600;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: #f0f0ff;
      color: var(--primary);
    }

    .main {
      flex: 1;
      padding: 28px;
      max-width: 1400px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 27px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card,
    .content-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.04);
    }

    .stat-title {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 750;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 18px;
    }

    .content-card h3 {
      margin-bottom: 14px;
      font-size: 17px;
    }

    .empty-state {
      text-align: center;
      padding: 35px 15px;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }

      .main {
        padding: 20px 15px 90px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 15px;
      }

      .topbar-brand span {
        font-size: 14px;
      }

      .welcome h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================= -->

  <section id="authScreen">

    <div class="auth-container">

      <div class="brand">
        <div class="app-icon">T</div>

        <h1>Tutor Management</h1>

        <p>補習管理系統</p>
      </div>

      <div class="auth-card">

        <h2 id="authTitle">Welcome back</h2>

        <p class="subtitle" id="authSubtitle">
          登入你的帳戶
        </p>

        <form id="authForm">

          <div class="field">
            <label for="email">
              Email 電郵
            </label>

            <input
              id="email"
              type="email"
              placeholder="example@email.com"
              required
            />
          </div>

          <div
            class="field"
            id="phoneField"
            style="display:none;"
          >
            <label for="phone">
              Phone 電話
            </label>

            <div class="phone-row">

              <div class="country-code">
                🇭🇰 +852
              </div>

              <input
                id="phone"
                class="phone-input"
                type="tel"
                inputmode="numeric"
                maxlength="8"
                placeholder="91234567"
              />

            </div>
          </div>

          <div class="field">
            <label for="password">
              Password 密碼
            </label>

            <input
              id="password"
              type="password"
              placeholder="••••••••"
              minlength="6"
              required
            />
          </div>

          <div
            class="field"
            id="nameField"
            style="display:none;"
          >
            <label for="fullName">
              Name 姓名
            </label>

            <input
              id="fullName"
              type="text"
              placeholder="你的姓名"
            />
          </div>

          <div
            class="field"
            id="roleField"
            style="display:none;"
          >
            <label for="role">
              Account Type 帳戶類型
            </label>

            <select
              id="role"
              style="
                width:100%;
                padding:13px;
                border:1px solid var(--border);
                border-radius:12px;
                background:white;
              "
            >
              <option value="tutor">
                Tutor 導師
              </option>

              <option value="parent">
                Parent 家長
              </option>
            </select>
          </div>

          <button
            class="primary-btn"
            type="submit"
            id="authButton"
          >
            Login 登入
          </button>

        </form>

        <div
          id="authMessage"
          class="message"
        ></div>

        <div class="switch-mode">
          <span id="switchText">
            還沒有帳戶？
          </span>

          <button
            type="button"
            id="switchMode"
          >
            建立帳戶
          </button>
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       APP SCREEN
  ========================= -->

  <section
    id="appScreen"
    class="hidden"
  >

    <header class="topbar">

      <div class="topbar-brand">

        <div class="small-icon">
          T
        </div>

        <span>
          Tutor Management
        </span>

      </div>

      <button
        class="logout-btn"
        id="logoutButton"
      >
        Logout 登出
      </button>

    </header>


    <div class="layout">

      <aside class="sidebar">

        <button class="nav-btn active">
          🏠 Dashboard
        </button>

        <button class="nav-btn">
          📅 Calendar 日曆
        </button>

        <button class="nav-btn">
          👨‍🎓 Students 學生
        </button>

        <button class="nav-btn">
          💰 Payments 收款
        </button>

        <button class="nav-btn">
          🔔 Notifications 通知
        </button>

        <button
          class="nav-btn"
          id="privateNotesNav"
        >
          🔒 Private Notes 私人備註
        </button>

      </aside>


      <main class="main">

        <div class="welcome">

          <h2 id="welcomeTitle">
            Welcome 👋
          </h2>

          <p id="welcomeSubtitle">
            歡迎使用補習管理系統
          </p>

        </div>


        <div class="stats">

          <div class="stat-card">

            <div class="stat-title">
              Students 學生
            </div>

            <div
              class="stat-value"
              id="studentCount"
            >
              0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-title">
              Upcoming Lessons 即將上堂
            </div>

            <div
              class="stat-value"
              id="lessonCount"
            >
              0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-title">
              Notifications 通知
            </div>

            <div
              class="stat-value"
              id="notificationCount"
            >
              0
            </div>

          </div>

        </div>


        <div class="dashboard-grid">

          <div class="content-card">

            <h3>
              Upcoming Lessons
              <span style="font-weight:400;color:var(--muted);">
                即將上堂
              </span>
            </h3>

            <div class="empty-state">
              暫時沒有課堂資料
              <br />
              Lesson information will appear here.
            </div>

          </div>


          <div class="content-card">

            <h3>
              Quick Notes
              <span style="font-weight:400;color:var(--muted);">
                快速備註
              </span>
            </h3>

            <div
              class="empty-state"
              id="notesArea"
            >
              暫時沒有備註
            </div>

          </div>

        </div>

      </main>

    </div>

  </section>


  <script>

    /* ==========================================
       SUPABASE CONFIGURATION
    ========================================== */

    const SUPABASE_URL =
      "https://kswyvpxzbjvjksfijfvl.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtzd3l2cHh6Ymp2amtzZmlqZnZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTI0NzAsImV4cCI6MjEwNDI2ODQ3MH0.4O2oKOLecu0JvxzLTPvUATb1mpfW5pUp9fiGeDwI0Qc";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* ==========================================
       ELEMENTS
    ========================================== */

    const authScreen =
      document.getElementById("authScreen");

    const appScreen =
      document.getElementById("appScreen");

    const authForm =
      document.getElementById("authForm");

    const authTitle =
      document.getElementById("authTitle");

    const authSubtitle =
      document.getElementById("authSubtitle");

    const authButton =
      document.getElementById("authButton");

    const switchMode =
      document.getElementById("switchMode");

    const switchText =
      document.getElementById("switchText");

    const authMessage =
      document.getElementById("authMessage");

    const nameField =
      document.getElementById("nameField");

    const roleField =
      document.getElementById("roleField");

    const phoneField =
      document.getElementById("phoneField");

    const logoutButton =
      document.getElementById("logoutButton");

    const privateNotesNav =
      document.getElementById("privateNotesNav");


    let isSignUp = false;


    /* ==========================================
       MESSAGE
    ========================================== */

    function showMessage(message, type = "error") {

      authMessage.textContent = message;

      authMessage.className =
        `message ${type}`;

    }


    function clearMessage() {

      authMessage.textContent = "";

      authMessage.className =
        "message";

    }


    /* ==========================================
       AUTH MODE
    ========================================== */

    switchMode.addEventListener(
      "click",
      () => {

        isSignUp = !isSignUp;

        clearMessage();

        if (isSignUp) {

          authTitle.textContent =
            "Create account";

          authSubtitle.textContent =
            "建立你的帳戶";

          authButton.textContent =
            "Create Account 建立帳戶";

          switchText.textContent =
            "已經有帳戶？";

          switchMode.textContent =
            "登入";

          nameField.style.display =
            "block";

          roleField.style.display =
            "block";

          /*
            Phone is collected as profile data.
            Authentication remains Email + Password.
          */

          phoneField.style.display =
            "block";

          document
            .getElementById("phone")
            .required = true;

        } else {

          authTitle.textContent =
            "Welcome back";

          authSubtitle.textContent =
            "登入你的帳戶";

          authButton.textContent =
            "Login 登入";

          switchText.textContent =
            "還沒有帳戶？";

          switchMode.textContent =
            "建立帳戶";

          nameField.style.display =
            "none";

          roleField.style.display =
            "none";

          phoneField.style.display =
            "none";

          document
            .getElementById("phone")
            .required = false;

        }

      }
    );


    /* ==========================================
       SIGN UP / LOGIN
    ========================================== */

    authForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessage();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        try {

          authButton.disabled = true;

          if (isSignUp) {

            const fullName =
              document
                .getElementById("fullName")
                .value
                .trim();

            const phone =
              document
                .getElementById("phone")
                .value
                .trim();

            const role =
              document
                .getElementById("role")
                .value;

            if (!/^\d{8}$/.test(phone)) {

              throw new Error(
                "請輸入 8 位香港電話號碼。Please enter an 8-digit Hong Kong phone number."
              );

            }

            const normalizedPhone =
              "+852" + phone;

            const {
              data,
              error
            } =
              await supabaseClient.auth.signUp({
                email,
                password
              });

            if (error) {
              throw error;
            }

            if (!data.user) {
              throw new Error(
                "Unable to create account."
              );
            }

            const {
              error: profileError
            } =
              await supabaseClient
                .from("profiles")
                .insert({
                  id: data.user.id,
                  full_name: fullName,
                  role: role,
                  phone: normalizedPhone
                });

            if (profileError) {
              throw profileError;
            }

            showMessage(
              "Account created successfully. 帳戶建立成功。",
              "success"
            );

            isSignUp = false;

            setTimeout(
              () => {
                window.location.reload();
              },
              900
            );

          } else {

            const {
              error
            } =
              await supabaseClient.auth.signInWithPassword({
                email,
                password
              });

            if (error) {
              throw error;
            }

            await loadApp();

          }

        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Login failed. 登入失敗。"
          );

        } finally {

          authButton.disabled = false;

        }

      }
    );


    /* ==========================================
       LOAD APP
    ========================================== */

    async function loadApp() {

      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();

      if (!user) {
        showAuth();
        return;
      }

      const {
        data: profile,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .single();

      if (error) {

        console.error(error);

        showMessage(
          "Unable to load profile."
        );

        return;
      }

      authScreen.classList.add("hidden");

      appScreen.classList.remove("hidden");

      const role =
        profile.role;

      document.getElementById(
        "welcomeTitle"
      ).textContent =
        `Welcome, ${profile.full_name || "User"} 👋`;

      document.getElementById(
        "welcomeSubtitle"
      ).textContent =
        role === "tutor"
          ? "Tutor Dashboard · 導師管理中心"
          : "Parent Dashboard · 家長管理中心";


      /*
        Private Notes navigation is Tutor-only.
      */

      if (role === "tutor") {

        privateNotesNav.style.display =
          "block";

      } else {

        privateNotesNav.style.display =
          "none";

      }

    }


    function showAuth() {

      appScreen.classList.add("hidden");

      authScreen.classList.remove("hidden");

    }


    /* ==========================================
       LOGOUT
    ========================================== */

    logoutButton.addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        showAuth();

      }
    );


    /* ==========================================
       AUTH STATE
    ========================================== */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (session) {

          await loadApp();

        } else {

          showAuth();

        }

      }
    );


    /* ==========================================
       INITIAL SESSION
    ========================================== */

    async function initialise() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();

      if (session) {

        await loadApp();

      } else {

        showAuth();

      }

    }


    initialise();

  </script>

</body>
</html>
